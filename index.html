<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#4B5563" />
    <meta
      name="description"
      content="Plataforma web interactiva completa para aprender Java desde Junior hasta Mid Level con Spring Boot, JPA, Concurrencia y Testing. 55+ ejemplos prácticos."
    />
    <title>Java Learning Platform</title>
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />
    <link href="./static/css/main.54ab3197.css" rel="stylesheet">
</head>
<body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script>
        // Cargar la aplicación React
        window.onload = function() {
            console.log('Loading React app...');
            
            // Intentar cargar el script principal
            var script = document.createElement('script');
            script.src = './static/js/main.5fb378b2.js';
            script.async = true;
            
            script.onload = function() {
                console.log('React app loaded successfully');
                // Limpiar cualquier loading
                var loading = document.querySelector('.loading');
                if (loading) {
                    loading.style.display = 'none';
                }
            };
            
            script.onerror = function() {
                console.error('Error loading React app');
                document.getElementById('root').innerHTML = 
                    '<div style="display: flex; justify-content: center; align-items: center; height: 100vh; font-family: Arial, sans-serif; text-align: center; padding: 20px;">' +
                    '<div style="color: #dc2626; font-size: 18px; margin-bottom: 20px;">❌ Error al cargar la aplicación</div>' +
                    '<div style="color: #4b5563; font-size: 14px;">' +
                    '<p>Intenta recargar la página</p>' +
                    '<a href="https://egarciav.github.io/java-learning-platform/" style="color: #4b5563; text-decoration: underline;">' +
                    'Ir a Java Learning Platform' +
                    '</a>' +
                    '</div>';
            };
            
            document.head.appendChild(script);
        };
    </script>
</body>
</html>

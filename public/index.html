<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Java Learning Platform</title>
    <link rel="icon" href="/favicon.ico" />
    <meta name="theme-color" content="#4B5563" />
    <meta name="description" content="Plataforma web interactiva completa para aprender Java desde Junior hasta Mid Level con Spring Boot, JPA, Concurrencia y Testing. 55+ ejemplos prácticos." />
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
                sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        #root {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-size: 18px;
            color: #4B5563;
            text-align: center;
            flex-direction: column;
        }
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #4B5563;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="root">
        <div class="loading">
            <div class="loading-spinner"></div>
            <div>Cargando Java Learning Platform...</div>
            <div style="margin-top: 20px; font-size: 14px; opacity: 0.7;">
                Si no carga en 5 segundos, <a href="/java-learning-platform/" style="color: #4B5563;">haz clic aquí</a>
            </div>
        </div>
    </div>
    
    <script>
        // Cargar la aplicación React
        (function() {
            // Detectar si estamos en GitHub Pages
            const isGitHubPages = window.location.hostname.includes('github.io');
            
            if (isGitHubPages) {
                // Esperar un poco y luego cargar el script de React
                setTimeout(function() {
                    const script = document.createElement('script');
                    script.src = './static/js/main.467b0b79.js';
                    script.async = true;
                    script.onload = function() {
                        console.log('React app loaded successfully');
                        // Limpiar el loading
                        setTimeout(function() {
                            const loading = document.querySelector('.loading');
                            if (loading) {
                                loading.style.display = 'none';
                            }
                        }, 1000);
                    };
                    script.onerror = function() {
                        document.getElementById('root').innerHTML = 
                            '<div class="loading">' +
                            '<div style="color: #dc2626;">❌ Error al cargar la aplicación</div>' +
                            '<div style="margin-top: 20px; font-size: 14px;">' +
                            '<a href="https://egarciav.github.io/java-learning-platform/" style="color: #4B5563;">' +
                            'Intentar recargar la página' +
                            '</a>' +
                            '</div>';
                    };
                    
                    document.head.appendChild(script);
                }, 500);
            }
        })();
    </script>
</body>
</html>
